name: SANY IPTV Phone Auto Release
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-compatible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Configure Firebase
        env:
          FIREBASE_JSON: ${{ secrets.SANY_FIREBASE_JSON }}
        run: |
          if [ -n "$FIREBASE_JSON" ]; then
            printf '%s' "$FIREBASE_JSON" > app/google-services.json
          fi
      - name: Decode existing production signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SANY_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing production signing keystore secret" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sany-release.jks"
          echo "SANY_KEYSTORE_PATH=$RUNNER_TEMP/sany-release.jks" >> "$GITHUB_ENV"
      - name: Pin CloudStream Android SDK to installed platform
        run: sed -i 's/^compileSdk = "37"$/compileSdk = "36"/' cloudstream-upstream/gradle/libs.versions.toml
      - name: Build production-signed Phone APK
        env:
          SANY_KEYSTORE_PASSWORD: ${{ secrets.SANY_RELEASE_STORE_PASSWORD }}
          SANY_KEY_ALIAS: ${{ secrets.SANY_RELEASE_KEY_ALIAS }}
          SANY_KEY_PASSWORD: ${{ secrets.SANY_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$SANY_KEYSTORE_PASSWORD" || (echo "Missing production store password" && exit 1)
          test -n "$SANY_KEY_ALIAS" || (echo "Missing production key alias" && exit 1)
          test -n "$SANY_KEY_PASSWORD" || (echo "Missing production key password" && exit 1)
          gradle :app:assembleMobileRelease -PAPP_VERSION_NAME="1.2.452" -PAPP_VERSION_CODE="452000"
      - uses: actions/upload-artifact@v4
        with:
          name: sany-iptv-1.2.452-production-signed
          path: app/build/outputs/apk/mobile/release/app-mobile-release.apk
          retention-days: 14

      - name: Publish Phone APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sany-iptv-phone-v1.2.452-${{ github.run_number }}
          name: SANY IPTV Phone 1.2.452 (Build ${{ github.run_number }})
          body: |
            SANY IPTV Android Phone app.
            Built automatically from the main branch after a successful production-signed build.
            Package: com.sany.iptv
          files: app/build/outputs/apk/mobile/release/app-mobile-release.apk
          draft: false
          prerelease: false
