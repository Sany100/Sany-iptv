name: Android TV Release APK
on:
  push:
    branches:
      - "tv/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-tv-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Configure Firebase Analytics
        env:
          FIREBASE_JSON: ${{ secrets.SANY_FIREBASE_JSON }}
        run: |
          if [ -n "$FIREBASE_JSON" ]; then
            printf '%s' "$FIREBASE_JSON" > app/google-services.json
          else
            echo "Firebase Analytics not configured; building without analytics."
          fi
      - name: Decode release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SANY_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing SANY_RELEASE_KEYSTORE_BASE64 repository secret" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sany-release.jks"
          echo "SANY_KEYSTORE_PATH=$RUNNER_TEMP/sany-release.jks" >> "$GITHUB_ENV"
      - name: Build signed Android TV release APK
        env:
          SANY_KEYSTORE_PASSWORD: ${{ secrets.SANY_RELEASE_STORE_PASSWORD }}
          SANY_KEY_ALIAS: ${{ secrets.SANY_RELEASE_KEY_ALIAS }}
          SANY_KEY_PASSWORD: ${{ secrets.SANY_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$SANY_KEYSTORE_PASSWORD" || (echo "Missing SANY_RELEASE_STORE_PASSWORD repository secret" && exit 1)
          test -n "$SANY_KEY_ALIAS" || (echo "Missing SANY_RELEASE_KEY_ALIAS repository secret" && exit 1)
          test -n "$SANY_KEY_PASSWORD" || (echo "Missing SANY_RELEASE_KEY_PASSWORD repository secret" && exit 1)
          gradle assembleTvRelease -PAPP_VERSION_NAME="1.2.453-tv" -PAPP_VERSION_CODE="453"
      - name: Verify APK signature and Android compatibility
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/tv/release -name '*.apk' -print -quit)
          if [ -z "$APK" ]; then
            echo "::error::TV Release APK was not produced"
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          test -x "$AAPT"
          test -x "$ZIPALIGN"

          "$APKSIGNER" verify --verbose "$APK"
          "$ZIPALIGN" -c -v 4 "$APK"

          BADGING=$("$AAPT" dump badging "$APK")
          echo "---- APK manifest metadata ----"
          printf '%s\n' "$BADGING" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|native-code:)"
          echo "--------------------------------"

          if ! printf '%s\n' "$BADGING" | grep -Fq "sdkVersion:'29'"; then
            echo "::error::Expected minSdkVersion 29 (Android 10). Actual metadata is shown above."
            exit 1
          fi
          if ! printf '%s\n' "$BADGING" | grep -Fq "package: name='com.sany.iptv.tv'"; then
            echo "::error::Unexpected TV application ID. Actual metadata is shown above."
            exit 1
          fi

          echo "TV APK signature, alignment, package ID and Android 10 minimum verified."
      - uses: actions/upload-artifact@v4
        with:
          name: sany-iptv-tv-v1.2.453-release
          path: app/build/outputs/apk/tv/release/*.apk
          if-no-files-found: error
          retention-days: 30
