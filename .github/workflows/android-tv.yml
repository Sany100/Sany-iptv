name: SANY IPTV Android TV
on:
  push:
    branches: [ android-tv-v1.2.452 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    if: github.event_name == 'push' && github.ref == 'refs/heads/android-tv-v1.2.452'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Configure Android SDK and install required packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || (echo "sdkmanager not found at $SDKMANAGER" && find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f && exit 1)
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Configure Firebase Analytics
        env:
          FIREBASE_JSON: ${{ secrets.SANY_FIREBASE_JSON }}
        run: |
          if [ -n "$FIREBASE_JSON" ]; then
            printf '%s' "$FIREBASE_JSON" > app/google-services.json
          fi
      - name: Build Android TV debug APK
        run: gradle assembleTvDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sany-iptv-android-tv-debug
          path: app/build/outputs/apk/tv/debug/app-tv-debug.apk
          if-no-files-found: error

  # Signed production TV release is deliberately manual-only.
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/android-tv-v1.2.452'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Configure Android SDK and install required packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || (echo "sdkmanager not found at $SDKMANAGER" && find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f && exit 1)
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Configure Firebase Analytics
        env:
          FIREBASE_JSON: ${{ secrets.SANY_FIREBASE_JSON }}
        run: |
          if [ -n "$FIREBASE_JSON" ]; then
            printf '%s' "$FIREBASE_JSON" > app/google-services.json
          fi
      - name: Decode release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SANY_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing SANY_RELEASE_KEYSTORE_BASE64 repository secret" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sany-release.jks"
          echo "SANY_KEYSTORE_PATH=$RUNNER_TEMP/sany-release.jks" >> "$GITHUB_ENV"
      - name: Build signed Android TV release APK
        env:
          SANY_KEYSTORE_PASSWORD: ${{ secrets.SANY_RELEASE_STORE_PASSWORD }}
          SANY_KEY_ALIAS: ${{ secrets.SANY_RELEASE_KEY_ALIAS }}
          SANY_KEY_PASSWORD: ${{ secrets.SANY_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$SANY_KEYSTORE_PASSWORD" || (echo "Missing SANY_RELEASE_STORE_PASSWORD repository secret" && exit 1)
          test -n "$SANY_KEY_ALIAS" || (echo "Missing SANY_RELEASE_KEY_ALIAS repository secret" && exit 1)
          test -n "$SANY_KEY_PASSWORD" || (echo "Missing SANY_RELEASE_KEY_PASSWORD repository secret" && exit 1)
          VERSION="1.2.452-TV.$GITHUB_RUN_NUMBER"
          VERSION_CODE="$((452000 + GITHUB_RUN_NUMBER))"
          gradle assembleTvRelease -PAPP_VERSION_NAME="$VERSION" -PAPP_VERSION_CODE="$VERSION_CODE"
          APK="app/build/outputs/apk/tv/release/app-tv-release.apk"
          test -s "$APK" || (echo "TV release APK was not generated" && exit 1)
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=sany-iptv-android-tv-$VERSION" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: sany-iptv-android-tv-release
          path: app/build/outputs/apk/tv/release/app-tv-release.apk
          if-no-files-found: error
      - name: Publish Android TV Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: SANY IPTV Android TV ${{ env.RELEASE_VERSION }}
          body: |
            Separate Android TV release based on SANY IPTV v1.2.452.
            Minimum Android version: Android 10 (API 29).
            Package: com.sany.iptv.tv
          files: app/build/outputs/apk/tv/release/app-tv-release.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
