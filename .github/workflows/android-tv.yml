name: Android TV APK
on:
  push:
    branches:
      - "tv/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-tv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Configure Firebase Analytics
        env:
          FIREBASE_JSON: ${{ secrets.SANY_FIREBASE_JSON }}
        run: |
          if [ -n "$FIREBASE_JSON" ]; then
            printf '%s' "$FIREBASE_JSON" > app/google-services.json
          else
            echo "Firebase Analytics not configured; building without analytics."
          fi
      - name: Build Android TV debug APK
        run: gradle assembleTvDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sany-iptv-tv-v1.2.452-debug
          path: app/build/outputs/apk/tv/debug/*.apk
          if-no-files-found: error
