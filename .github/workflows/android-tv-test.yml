name: Android TV Release APK
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-tv-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      # Build the current Android app source so the TV APK receives the latest mobile features and fixes.
      - uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install Android API 37 compile platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER" || (echo "Android SDK Manager not found" && exit 1)
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platforms;android-37.0"
          # Android Gradle Plugin resolves compileSdk 37 using the android-37
          # directory name, while Google's SDK package is published as 37.0.
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          test -d "$ANDROID_HOME/platforms/android-37"
      - name: Add separate Android TV product flavor to the released source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/build.gradle.kts")
          source = path.read_text()
          marker = '    buildTypes {'
          flavor_block = '''    // Build TV from the exact mobile release source and retain every released setting.
              // Only package identity and Android TV minimum API differ.
              flavorDimensions += "device"
              productFlavors {
                  create("mobile") {
                      dimension = "device"
                      minSdk = 23
                  }
                  create("tv") {
                      dimension = "device"
                      applicationIdSuffix = ".tv"
                      minSdk = 29
                  }
              }

          '''
          if 'create("tv")' not in source:
              if marker not in source:
                  raise SystemExit("Could not locate buildTypes block; refusing an unsafe Gradle edit.")
              source = source.replace(marker, flavor_block + marker, 1)
          # Use the installed Android 37 compile platform regardless of the current mobile baseline.
          compile_sdk_matches = list(re.finditer(r"(?m)^(\s*compileSdk\s*=\s*)\d+\s*$", source))
          if len(compile_sdk_matches) != 1:
              raise SystemExit("Could not uniquely locate compileSdk; refusing an unsafe Gradle edit.")
          source = re.sub(
              r"(?m)^(\s*compileSdk\s*=\s*)\d+\s*$",
              r"\g<1>37",
              source,
              count=1
          )
          if 'enableV1Signing = true' not in source:
              source = source.replace(
                  '        create("release") {',
                  '        create("release") {\n            enableV1Signing = true\n            enableV2Signing = true',
                  1
              )
          path.write_text(source)

          # Override only the TV flavor launcher label; mobile remains "SANY IPTV".
          tv_manifest = Path("app/src/tv/AndroidManifest.xml")
          tv_manifest.parent.mkdir(parents=True, exist_ok=True)
          # Mark the application label as replaceable in the checked-out release manifest.
          # This is applied only inside the CI workspace, never committed to the mobile source.
          main_manifest = Path("app/src/main/AndroidManifest.xml")
          manifest_source = main_manifest.read_text()
          if 'xmlns:tools="http://schemas.android.com/tools"' not in manifest_source:
              manifest_source = manifest_source.replace(
                  '<manifest ',
                  '<manifest xmlns:tools="http://schemas.android.com/tools" ',
                  1
              )
          app_start = manifest_source.find("<application")
          app_end = manifest_source.find(">", app_start) if app_start >= 0 else -1
          if app_start < 0 or app_end < 0:
              raise SystemExit("Could not locate main application manifest tag; refusing an unsafe manifest edit.")
          application_tag = manifest_source[app_start:app_end + 1]
          if 'tools:replace=' not in application_tag:
              updated_tag = application_tag[:-1] + ' tools:replace="android:label">'
              manifest_source = manifest_source[:app_start] + updated_tag + manifest_source[app_end + 1:]
          main_manifest.write_text(manifest_source)

          tv_manifest = Path("app/src/tv/AndroidManifest.xml")
          tv_manifest.parent.mkdir(parents=True, exist_ok=True)
          # Android TV launchers use a wide banner, not only the phone adaptive icon.
          # Compose the banner from the existing SANY logo so no new binary artwork is needed.
          banner_dir = Path("app/src/main/res/drawable")
          banner_dir.mkdir(parents=True, exist_ok=True)
          (banner_dir / "tv_banner.xml").write_text("""<layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@color/launcher_background" />
              <item
                  android:width="120dp"
                  android:height="120dp"
                  android:gravity="center"
                  android:drawable="@drawable/sany_logo_icon" />
          </layer-list>
          """)

          # TV-only landscape, immersive display, and reduced window transitions.
          tv_activity_patch = """<manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools">
              <application>
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:resizeableActivity="true" />
              </application>
          </manifest>
          """
          tv_manifest.write_text(tv_activity_patch.replace(
              '<application>',
              '<application android:label="SANY IPTV Android TV" android:banner="@drawable/tv_banner" tools:replace="android:label">'
          ))

          main_activity = Path("app/src/main/java/com/sany/iptv/MainActivity.kt")
          main_source = main_activity.read_text()
          on_create_marker = "        super.onCreate(savedInstanceState)\\n"
          if main_source.count(on_create_marker) != 1:
              raise SystemExit("Could not uniquely locate MainActivity.onCreate; refusing an unsafe TV edit.")
          tv_startup = """        if (isTvDevice) {
                  requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE
                  window.setWindowAnimations(0)
              }
          """
          main_source = main_source.replace(on_create_marker, on_create_marker + tv_startup, 1)

          bars_marker = "    private fun applySystemBars() {\\n"
          if main_source.count(bars_marker) != 1:
              raise SystemExit("Could not uniquely locate system bar configuration; refusing an unsafe TV edit.")
          tv_bars = """        if (isTvDevice) {
                  androidx.core.view.WindowCompat.setDecorFitsSystemWindows(window, false)
                  window.decorView.systemUiVisibility =
                      View.SYSTEM_UI_FLAG_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE or
                      View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                  window.setWindowAnimations(0)
                  return
              }
          """
          main_source = main_source.replace(bars_marker, bars_marker + tv_bars, 1)
          main_activity.write_text(main_source)

          # Keep both SANY indicators static in the TV build only.
          # Replace the complete watermark-dot declaration by its static equivalent.
          main_activity = Path("app/src/main/java/com/sany/iptv/MainActivity.kt")
          main_source = main_activity.read_text()

          dot_start = '            val liveDot = text("●"'
          dot_end = '            watermarkLine.addView(liveDot'
          if main_source.count(dot_start) != 1 or main_source.count(dot_end) != 1:
              raise SystemExit("Could not uniquely locate channel watermark dot; refusing an unsafe TV edit.")
          start = main_source.index(dot_start)
          end = main_source.index(dot_end, start)
          if end <= start:
              raise SystemExit("Unexpected channel watermark layout; refusing an unsafe TV edit.")
          static_dot = '''            val liveDot = text("●", 9, Color.rgb(0, 235, 90), true).apply {
                  contentDescription = "SANY IPTV live indicator"
                  alpha = 1f
              }
          '''
          main_source = main_source[:start] + static_dot + main_source[end:]

          # Remove only the CONNECTED dot animator when the source has one.
          # Newer Android app sources already render this status as a static text indicator.
          connected_start = '            android.animation.ObjectAnimator.ofFloat(connectedDot'
          connected_end = '            connectionStatus.addView(text(" CONNECTED"'
          start_count = main_source.count(connected_start)
          end_count = main_source.count(connected_end)
          if start_count == 1 and end_count == 1:
              start = main_source.index(connected_start)
              end = main_source.index(connected_end, start)
              if end <= start:
                  raise SystemExit("Unexpected CONNECTED status layout; refusing an unsafe TV edit.")
              main_source = main_source[:start] + main_source[end:]
          elif start_count != 0 or end_count != 0:
              raise SystemExit("Unexpected partial CONNECTED animation block; refusing an unsafe TV edit.")
          # If neither marker exists, the current source already has no CONNECTED dot animator.
          main_activity.write_text(main_source)

          print("TV flavor uses current Android source; TV-only display patches applied. Mobile source remains unchanged.")
          PY
      - name: Configure Firebase Analytics
        env:
          FIREBASE_JSON: ${{ secrets.SANY_FIREBASE_JSON }}
        run: |
          if [ -n "$FIREBASE_JSON" ]; then
            printf '%s' "$FIREBASE_JSON" > app/google-services.json
            echo "Firebase Analytics configured."
          else
            echo "Firebase Analytics not configured; building without analytics."
          fi
      - name: Decode existing production signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SANY_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing SANY_RELEASE_KEYSTORE_BASE64 repository secret" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sany-release.jks"
          echo "SANY_KEYSTORE_PATH=$RUNNER_TEMP/sany-release.jks" >> "$GITHUB_ENV"
      - name: Build signed Android TV release APK
        env:
          SANY_KEYSTORE_PASSWORD: ${{ secrets.SANY_RELEASE_STORE_PASSWORD }}
          SANY_KEY_ALIAS: ${{ secrets.SANY_RELEASE_KEY_ALIAS }}
          SANY_KEY_PASSWORD: ${{ secrets.SANY_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$SANY_KEYSTORE_PASSWORD" || (echo "Missing SANY_RELEASE_STORE_PASSWORD repository secret" && exit 1)
          test -n "$SANY_KEY_ALIAS" || (echo "Missing SANY_RELEASE_KEY_ALIAS repository secret" && exit 1)
          test -n "$SANY_KEY_PASSWORD" || (echo "Missing SANY_RELEASE_KEY_PASSWORD repository secret" && exit 1)
          gradle assembleTvRelease -PAPP_VERSION_NAME="1.2.452" -PAPP_VERSION_CODE="452"
          APK="app/build/outputs/apk/tv/release/app-tv-release.apk"
          test -s "$APK"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/tv-apk-badging.txt"
          grep -q "package: name='com.sany.iptv.tv'" "$RUNNER_TEMP/tv-apk-badging.txt"
          grep -q "sdkVersion:'29'" "$RUNNER_TEMP/tv-apk-badging.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: sany-iptv-android-tv-release-1.2.452
          path: app/build/outputs/apk/tv/release/app-tv-release.apk
          retention-days: 14
