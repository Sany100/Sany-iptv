name: SANY IPTV Android TV Release APK
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-tv-test.yml'
      - 'app/build.gradle.kts'
      - 'app/src/main/**'
      - 'app/src/tv/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-apk:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Configure Firebase Analytics
        env:
          FIREBASE_JSON: ${{ secrets.SANY_FIREBASE_JSON }}
        run: |
          if [ -n "$FIREBASE_JSON" ]; then
            printf '%s' "$FIREBASE_JSON" > app/google-services.json
            echo "Firebase Analytics configured."
          else
            echo "Firebase Analytics not configured; building without analytics."
          fi
      - name: Decode production signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SANY_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing SANY_RELEASE_KEYSTORE_BASE64 repository secret" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sany-release.jks"
          test -s "$RUNNER_TEMP/sany-release.jks"
          echo "SANY_KEYSTORE_PATH=$RUNNER_TEMP/sany-release.jks" >> "$GITHUB_ENV"
      - name: Build signed Android TV Release APK
        env:
          SANY_KEYSTORE_PASSWORD: ${{ secrets.SANY_RELEASE_STORE_PASSWORD }}
          SANY_KEY_ALIAS: ${{ secrets.SANY_RELEASE_KEY_ALIAS }}
          SANY_KEY_PASSWORD: ${{ secrets.SANY_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$SANY_KEYSTORE_PASSWORD" || (echo "Missing SANY_RELEASE_STORE_PASSWORD repository secret" && exit 1)
          test -n "$SANY_KEY_ALIAS" || (echo "Missing SANY_RELEASE_KEY_ALIAS repository secret" && exit 1)
          test -n "$SANY_KEY_PASSWORD" || (echo "Missing SANY_RELEASE_KEY_PASSWORD repository secret" && exit 1)
          VERSION="1.2.$GITHUB_RUN_NUMBER-TV"
          VERSION_CODE="$((100000 + GITHUB_RUN_NUMBER))"
          gradle assembleTvRelease -PAPP_VERSION_NAME="$VERSION" -PAPP_VERSION_CODE="$VERSION_CODE"
          APK="app/build/outputs/apk/tv/release/app-tv-release.apk"
          test -s "$APK" || (echo "TV Release APK was not generated" && exit 1)
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/aapt"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/tv-apk-badging.txt"
          grep -q "package: name='com.sany.iptv.tv'" "$RUNNER_TEMP/tv-apk-badging.txt"
          grep -q "sdkVersion:'29'" "$RUNNER_TEMP/tv-apk-badging.txt"
          grep -q "targetSdkVersion:'35'" "$RUNNER_TEMP/tv-apk-badging.txt"
          unzip -t "$APK"
          sha256sum "$APK" | tee "$RUNNER_TEMP/tv-apk-sha256.txt"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=sany-iptv-android-tv-v$VERSION" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: sany-iptv-android-tv-release
          path: app/build/outputs/apk/tv/release/app-tv-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish verified Android TV Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: SANY IPTV Android TV ${{ env.RELEASE_VERSION }}
          body: |
            Built from the main branch.
            Minimum Android version: Android 10 (API 29).
            Package: com.sany.iptv.tv
            APK signature, package ID, SDK metadata, and ZIP integrity are checked before publishing.
          files: app/build/outputs/apk/tv/release/app-tv-release.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
