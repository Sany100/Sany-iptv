name: Android TV Release APK
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-tv-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      # Build the exact source snapshot used by the latest released Android app.
      - uses: actions/checkout@v4
        with:
          ref: v1.2.452
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Add separate Android TV product flavor to the released source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle.kts")
          source = path.read_text()
          marker = '    buildTypes {'
          flavor_block = '''    // Build TV from the exact mobile release source and retain every released setting.
              // Only package identity and Android TV minimum API differ.
              flavorDimensions += "device"
              productFlavors {
                  create("mobile") {
                      dimension = "device"
                      minSdk = 23
                  }
                  create("tv") {
                      dimension = "device"
                      applicationIdSuffix = ".tv"
                      minSdk = 29
                  }
              }

          '''
          if 'create("tv")' not in source:
              if marker not in source:
                  raise SystemExit("Could not locate buildTypes block; refusing an unsafe Gradle edit.")
              source = source.replace(marker, flavor_block + marker, 1)
          if 'enableV1Signing = true' not in source:
              source = source.replace(
                  '        create("release") {',
                  '        create("release") {\n            enableV1Signing = true\n            enableV2Signing = true',
                  1
              )
          path.write_text(source)
          print("TV flavor added to v1.2.452 source; mobile source and settings remain unchanged.")
          PY
      - name: Configure Firebase Analytics
        env:
          FIREBASE_JSON: ${{ secrets.SANY_FIREBASE_JSON }}
        run: |
          if [ -n "$FIREBASE_JSON" ]; then
            printf '%s' "$FIREBASE_JSON" > app/google-services.json
            echo "Firebase Analytics configured."
          else
            echo "Firebase Analytics not configured; building without analytics."
          fi
      - name: Decode existing production signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SANY_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing SANY_RELEASE_KEYSTORE_BASE64 repository secret" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sany-release.jks"
          echo "SANY_KEYSTORE_PATH=$RUNNER_TEMP/sany-release.jks" >> "$GITHUB_ENV"
      - name: Build signed Android TV release APK
        env:
          SANY_KEYSTORE_PASSWORD: ${{ secrets.SANY_RELEASE_STORE_PASSWORD }}
          SANY_KEY_ALIAS: ${{ secrets.SANY_RELEASE_KEY_ALIAS }}
          SANY_KEY_PASSWORD: ${{ secrets.SANY_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$SANY_KEYSTORE_PASSWORD" || (echo "Missing SANY_RELEASE_STORE_PASSWORD repository secret" && exit 1)
          test -n "$SANY_KEY_ALIAS" || (echo "Missing SANY_RELEASE_KEY_ALIAS repository secret" && exit 1)
          test -n "$SANY_KEY_PASSWORD" || (echo "Missing SANY_RELEASE_KEY_PASSWORD repository secret" && exit 1)
          gradle assembleTvRelease -PAPP_VERSION_NAME="1.2.452" -PAPP_VERSION_CODE="452"
          APK="app/build/outputs/apk/tv/release/app-tv-release.apk"
          test -s "$APK"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/tv-apk-badging.txt"
          grep -q "package: name='com.sany.iptv.tv'" "$RUNNER_TEMP/tv-apk-badging.txt"
          grep -q "sdkVersion:'29'" "$RUNNER_TEMP/tv-apk-badging.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: sany-iptv-android-tv-release-1.2.452
          path: app/build/outputs/apk/tv/release/app-tv-release.apk
          retention-days: 14
