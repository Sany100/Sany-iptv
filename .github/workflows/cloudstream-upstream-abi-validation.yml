name: Validate pinned CloudStream upstream ABI baseline

on:
  workflow_dispatch:
  push:
    branches:
      - feature/cloudstream-gpl-runtime-port
    paths:
      - "cloudstream-runtime/**"
      - "cloudstream-original/AniLight/**"
      - ".github/workflows/cloudstream-upstream-abi-validation.yml"

permissions:
  contents: read

concurrency:
  group: cloudstream-upstream-abi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upstream-baseline:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout SANY integration source
        uses: actions/checkout@v4
        with:
          path: sany

      - name: Checkout exact CloudStream upstream revision
        uses: actions/checkout@v4
        with:
          repository: recloudstream/cloudstream
          ref: a28e6468f54cfe420feebd205d3d21d08ed0cde8
          path: cloudstream-upstream

      - name: Verify immutable upstream revision and ABI source files
        working-directory: cloudstream-upstream
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "a28e6468f54cfe420feebd205d3d21d08ed0cde8"
          test -f library/src/commonMain/kotlin/com/lagradost/cloudstream3/MainAPI.kt
          test -f library/src/commonMain/kotlin/com/lagradost/cloudstream3/plugins/BasePlugin.kt
          test -f library/src/commonMain/kotlin/com/lagradost/cloudstream3/utils/ExtractorApi.kt
          test -f app/src/main/java/com/lagradost/cloudstream3/plugins/Plugin.kt
          test -f app/src/main/java/com/lagradost/cloudstream3/plugins/PluginManager.kt
          echo "Pinned upstream revision: $ACTUAL"
          echo "MainAPI, BasePlugin and ExtractorApi are in :library."
          echo "Android Plugin and PluginManager are in :app."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: cloudstream-upstream/gradle/libs.versions.toml

      - name: Install required Android SDK packages from runner SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/cmdline-tools"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "Using SDK manager: $SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          set -o pipefail
          # Use API 36 for this baseline because API 37 is unavailable on the runner.
          sed -i 's/compileSdk = "37"/compileSdk = "36"/' cloudstream-upstream/gradle/libs.versions.toml
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build the exact upstream library and Android plugin host
        working-directory: cloudstream-upstream
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :library:assemble :app:compileStableDebugKotlin

      - name: Compile the unchanged AniLight provider against the exact upstream Android host ABI
        shell: bash
        run: |
          set -euo pipefail
          test -d sany/cloudstream-original/AniLight/src/main/kotlin
          # Compile the real provider sources inside the pinned upstream app module.
          # This exposes the actual upstream :library and Android :app APIs on the
          # compiler classpath; no local/fake CloudStream ABI stubs are introduced.
          cp -R sany/cloudstream-original/AniLight/src/main/kotlin/. cloudstream-upstream/app/src/main/java/
          cd cloudstream-upstream
          ./gradlew --no-daemon --stacktrace :app:compileStableDebugKotlin

      - name: Record the scope of this validation
        if: always()
        shell: bash
        run: |
          {
            echo "## CloudStream upstream ABI baseline"
            echo
            echo "- Pinned source: recloudstream/cloudstream@a28e6468f54cfe420feebd205d3d21d08ed0cde8"
            echo "- This job compiles upstream :library and the upstream Android plugin host stable debug variant."
            echo "- It then compiles the unchanged AniLight Kotlin source inside that exact pinned upstream Android app module, against the real upstream app/library classpath."
            echo "- This validates source/API compatibility only; it does not prove DEX loading, live API responses, or playback in SANY."
            echo "- SANY APK integration, DEX loading, and playback remain separate acceptance gates."
          } >> "$GITHUB_STEP_SUMMARY"
