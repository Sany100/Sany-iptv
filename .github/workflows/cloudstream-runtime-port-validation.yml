name: CloudStream Runtime Port Validation

on:
  push:
    branches:
      - feature/cloudstream-gpl-runtime-port
    paths:
      - 'app/**'
      - 'cloudstream-runtime/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/cloudstream-runtime-port-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-sany-host:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runtime port branch
        uses: actions/checkout@v4
        with:
          ref: feature/cloudstream-gpl-runtime-port

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Build SANY debug APK
        run: gradle assembleDebug

      - name: Upload host APK (not a CloudStream-runtime-enabled build)
        uses: actions/upload-artifact@v4
        with:
          name: sany-runtime-port-host-validation
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
