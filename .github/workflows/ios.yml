name: iOS Build
on:
  push:
    branches: [main, ios-bootstrap]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-simulator:
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Generate Android-matching iOS app icon and Xcode project
        run: |
          python3 -m pip install --user cairosvg
          python3 ios/generate_app_icon.py
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build iPhone Simulator app
        run: |
          xcodebuild \
            -project ios/SANYIPTV.xcodeproj \
            -scheme SANYIPTV \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: SANY-IPTV-iOS-Simulator
          path: build/Build/Products/Debug-iphonesimulator/SANYIPTV.app
          if-no-files-found: error
