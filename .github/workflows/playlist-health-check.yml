name: Playlist Health Check

on:
  push:
    branches: [main]
    paths:
      - 'playlist.m3u'
      - '.github/workflows/playlist-health-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check playlist streams
        run: |
          python - <<'PY'
          import concurrent.futures, csv, re, urllib.parse, urllib.request
          from pathlib import Path

          lines = Path("playlist.m3u").read_text(encoding="utf-8").splitlines()
          items = []
          for i, line in enumerate(lines):
              if line.startswith("#EXTINF"):
                  name = line.rsplit(",", 1)[-1].strip()
                  url = next((x.strip() for x in lines[i+1:] if x.strip() and not x.strip().startswith("#")), "")
                  if url.startswith(("http://", "https://")):
                      items.append((name, url))

          def request(url):
              clean = urllib.parse.urldefrag(url)[0]
              req = urllib.request.Request(clean, headers={"User-Agent":"Mozilla/5.0 SANY-IPTV-HealthCheck","Accept":"*/*"})
              try:
                  with urllib.request.urlopen(req, timeout=12) as r:
                      body = r.read(160000)
                      status = r.status
                      ctype = r.headers.get("Content-Type", "")
                  if status < 200 or status >= 300:
                      return status, "HTTP"
                  if ".m3u8" in clean.lower() or "mpegurl" in ctype.lower():
                      text = body.decode("utf-8", "ignore")
                      if "#EXTM3U" not in text:
                          return status, "NOT_HLS"
                      seg = next((x.strip() for x in text.splitlines() if x.strip() and not x.startswith("#")), "")
                      if seg:
                          segurl = urllib.parse.urljoin(clean, seg)
                          q = urllib.request.Request(segurl, headers={"User-Agent":"Mozilla/5.0"})
                          try:
                              with urllib.request.urlopen(q, timeout=10) as sr:
                                  sr.read(2048)
                                  if sr.status < 200 or sr.status >= 300:
                                      return status, "SEGMENT_FAIL"
                          except Exception:
                              return status, "SEGMENT_FAIL"
                  return status, "OK"
              except Exception as e:
                  return 0, type(e).__name__

          with concurrent.futures.ThreadPoolExecutor(max_workers=25) as pool:
              results = list(pool.map(request, [u for _,u in items]))
          with open("playlist-health.csv", "w", newline="", encoding="utf-8") as f:
              w = csv.writer(f); w.writerow(["channel","url","http_status","result"])
              for (name,url),(status,result) in zip(items,results):
                  w.writerow([name,url,status,result])
          ok = sum(1 for _,r in results if r[1] == "OK")
          print(f"Checked {len(items)} URLs; working: {ok}; failed: {len(items)-ok}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: playlist-health-report
          path: playlist-health.csv
