name: Publish Development Release

on:
  push:
    branches:
      - development

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Configure Firebase Analytics
        env:
          FIREBASE_JSON: ${{ secrets.SANY_FIREBASE_JSON }}
        run: |
          if [ -n "$FIREBASE_JSON" ]; then
            printf '%s' "$FIREBASE_JSON" > app/google-services.json
          fi
      - name: Decode release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SANY_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing SANY_RELEASE_KEYSTORE_BASE64 repository secret" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sany-release.jks"
          echo "SANY_KEYSTORE_PATH=$RUNNER_TEMP/sany-release.jks" >> "$GITHUB_ENV"
      - name: Build signed APK
        env:
          SANY_KEYSTORE_PASSWORD: ${{ secrets.SANY_RELEASE_STORE_PASSWORD }}
          SANY_KEY_ALIAS: ${{ secrets.SANY_RELEASE_KEY_ALIAS }}
          SANY_KEY_PASSWORD: ${{ secrets.SANY_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$SANY_KEYSTORE_PASSWORD" || (echo "Missing SANY_RELEASE_STORE_PASSWORD repository secret" && exit 1)
          test -n "$SANY_KEY_ALIAS" || (echo "Missing SANY_RELEASE_KEY_ALIAS repository secret" && exit 1)
          test -n "$SANY_KEY_PASSWORD" || (echo "Missing SANY_RELEASE_KEY_PASSWORD repository secret" && exit 1)
          VERSION="1.2.302"
          VERSION_CODE="302"
          gradle assembleRelease -PAPP_VERSION_NAME="$VERSION" -PAPP_VERSION_CODE="$VERSION_CODE"
      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.302
          name: SANY IPTV 1.2.302
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
