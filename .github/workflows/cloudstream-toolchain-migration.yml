name: CloudStream toolchain migration validation

on:
  push:
    branches:
      - migration/cloudstream-runtime-toolchain
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/cloudstream-toolchain-migration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudstream-toolchain-migration
  cancel-in-progress: true

jobs:
  sany-debug:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify toolchain versions
        run: |
          gradle --version
          grep -n '9.1.1' build.gradle.kts
          grep -n 'compileSdk = 36' app/build.gradle.kts
          grep -n '1.9.3' app/build.gradle.kts

      - name: Build SANY debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload migration APK
        uses: actions/upload-artifact@v4
        with:
          name: sany-cloudstream-toolchain-migration-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
