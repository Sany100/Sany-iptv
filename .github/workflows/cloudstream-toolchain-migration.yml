# CI workflow for the pinned CloudStream runtime migration.
name: CloudStream toolchain migration validation
on:
  push:
    branches:
      - migration/cloudstream-runtime-toolchain
    paths:
      - "app/**"
      - "cloudstream-upstream"
      - "cloudstream-original/AniLight/**"
      - "cloudstream-anilight-abi/**"
      - ".gitmodules"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/cloudstream-toolchain-migration.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudstream-toolchain-migration
  cancel-in-progress: true
jobs:
  sany-debug:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout migration branch and pinned CloudStream submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify pinned CloudStream revision
        run: |
          test "$(git -C cloudstream-upstream rev-parse HEAD)" = "a28e6468f54cfe420feebd205d3d21d08ed0cde8"
          test -f cloudstream-upstream/library/build.gradle.kts
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Align compile SDK with available stable Android platform
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/compileSdk = 37/compileSdk = 36/' app/build.gradle.kts
          sed -i 's/compileSdk = "37"/compileSdk = "36"/' cloudstream-upstream/gradle/libs.versions.toml
          grep -n 'compileSdk = 36' app/build.gradle.kts
          grep -n 'compileSdk = "36"' cloudstream-upstream/gradle/libs.versions.toml
      - name: Verify toolchain versions
        run: |
          gradle --version
          grep -n '9.1.1' build.gradle.kts
          grep -n 'compileSdk = 36' app/build.gradle.kts
          grep -n '1.9.3' app/build.gradle.kts
      - name: Align upstream KMP plugin request with AGP-provided classpath
        shell: bash
        run: |
          set -euo pipefail
          FILE="cloudstream-upstream/library/build.gradle.kts"
          sed -i 's/alias(libs.plugins.kotlin.multiplatform)/id("org.jetbrains.kotlin.multiplatform")/' "$FILE"
          grep -n 'org.jetbrains.kotlin.multiplatform' "$FILE"
      - name: Compile AniLight provider against the exact CloudStream library ABI
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN="cloudstream-original/AniLight/src/main/kotlin/com/anilight/AniLightPlugin.kt"
          BACKUP="${PLUGIN}.abi-excluded"
          test -f "$PLUGIN"
          mv "$PLUGIN" "$BACKUP"
          restore_plugin() {
            if [ -f "$BACKUP" ]; then mv "$BACKUP" "$PLUGIN"; fi
          }
          trap restore_plugin EXIT
          gradle --no-daemon --stacktrace :cloudstream-anilight-abi:assembleDebug
      - name: Compile AniLight Plugin host and build SANY debug APK
        shell: bash
        run: |
          set -euo pipefail
          DONATION_DIR="cloudstream-original/AniLight/src/main/kotlin/com/raghav/donation"
          DONATION_BACKUP="${RUNNER_TEMP}/AniLight-donation-sany-excluded"
          if [ -d "$DONATION_DIR" ]; then
            mv "$DONATION_DIR" "$DONATION_BACKUP"
          fi
          restore_donation() {
            if [ -d "$DONATION_BACKUP" ]; then mv "$DONATION_BACKUP" "$DONATION_DIR"; fi
          }
          trap restore_donation EXIT
          gradle --no-daemon --stacktrace :app:compileDebugKotlin :app:assembleDebug
      - name: Upload migration APK
        uses: actions/upload-artifact@v4
        with:
          name: sany-cloudstream-library-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
