name: Build Six-Provider CloudStream Anime Plugins

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches:
      - main
      - feature/cloudstream-gpl-runtime-port
      - migration/cloudstream-runtime-toolchain
    paths:
      - "cloudstream-original/AniLight/**"
      - ".github/workflows/cloudstream-plugins.yml"

permissions:
  contents: write

concurrency:
  group: cloudstream-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SANY IPTV source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's ubuntu-latest runner already includes the Android SDK.
      # Avoid setup-android's legacy default "tools" package, which no longer exists.

      - name: Prepare CloudStream plugin build project
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/cloudstream3/plugin-template.git "$RUNNER_TEMP/cloudstream-build"
          # The template demo module is not needed and is incompatible with AGP 8 without a namespace.
          rm -rf "$RUNNER_TEMP/cloudstream-build/ExampleProvider"
          # Pin the CloudStream Gradle plugin to a concrete JitPack commit.
          # The template's master-SNAPSHOT coordinate is no longer resolvable.
          sed -i 's/com.github.recloudstream:gradle:master-SNAPSHOT/com.github.recloudstream:gradle:81b1d424d2/' "$RUNNER_TEMP/cloudstream-build/build.gradle.kts"
          sed -i 's/gradle-7.4-bin.zip/gradle-8.12-bin.zip/' "$RUNNER_TEMP/cloudstream-build/gradle/wrapper/gradle-wrapper.properties"
          sed -i 's/com.android.tools.build:gradle:7.0.4/com.android.tools.build:gradle:8.7.3/' "$RUNNER_TEMP/cloudstream-build/build.gradle.kts"
          sed -i 's/kotlin-gradle-plugin:1.7.10/kotlin-gradle-plugin:2.4.0/' "$RUNNER_TEMP/cloudstream-build/build.gradle.kts"
          sed -i 's/compileSdkVersion(30)/compileSdkVersion(36)/; s/targetSdk = 30/targetSdk = 35/' "$RUNNER_TEMP/cloudstream-build/build.gradle.kts"
          # Kotlin 2.4 removes the legacy kotlinOptions DSL; migrate the template compiler settings.
          python3 - "$RUNNER_TEMP/cloudstream-build/build.gradle.kts" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          source = path.read_text()
          pattern = r'tasks\.withType<org\.jetbrains\.kotlin\.gradle\.tasks\.KotlinCompile>\s*\{\s*kotlinOptions\s*\{.*?\n\s*\}\s*\}'
          replacement = '''tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
                  compilerOptions {
                      jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11)
                      freeCompilerArgs.addAll(
                          "-Xno-call-assertions",
                          "-Xno-param-assertions",
                          "-Xno-receiver-assertions"
                      )
                  }
              }'''
          updated, count = re.subn(pattern, lambda _: replacement, source, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f"Expected one legacy kotlinOptions block, found {count}")
          path.write_text(updated)
          PY
          # Match the pinned CloudStream Gradle plugin: it registers a configuration named "cloudstream".
          sed -i 's/val apk by configurations/val cloudstream by configurations/; s/apk("com.lagradost:cloudstream3:pre-release")/cloudstream("com.lagradost:cloudstream3:pre-release")/' "$RUNNER_TEMP/cloudstream-build/build.gradle.kts"
          # Use CloudStream-compatible NiceHttp and Jackson versions for the AniLight API client.
          sed -i 's/implementation("com.github.Blatzar:NiceHttp:0.3.2")/implementation("com.github.Blatzar:NiceHttp:0.4.18")/; /implementation("org.jsoup:jsoup:1.13.1")/a\\        implementation("com.fasterxml.jackson.module:jackson-module-kotlin:2.13.1")' "$RUNNER_TEMP/cloudstream-build/build.gradle.kts"
          # Pin the external provider source repository; do not build from a moving branch.
          git clone https://github.com/yonkou0/CloudStreamRepo.git "$RUNNER_TEMP/provider-sources"
          git -C "$RUNNER_TEMP/provider-sources" checkout --detach 62725f3b2eb2eae5eb30538f1dad84b0057a0c19
          cp -a "$GITHUB_WORKSPACE/source/cloudstream-original/AniLight" "$RUNNER_TEMP/cloudstream-build/AniLight"
          for provider in AniChan Anidap AniSuge Miruro AniKotoAnime; do
            cp -a "$RUNNER_TEMP/provider-sources/$provider" "$RUNNER_TEMP/cloudstream-build/$provider"
          done
          # AGP 8 requires explicit namespaces for the provider modules.
          printf '\nandroid {\n    namespace = "com.anilight"\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_11\n        targetCompatibility = JavaVersion.VERSION_11\n    }\n}\n' >> "$RUNNER_TEMP/cloudstream-build/AniLight/build.gradle.kts"
          for spec in "AniChan:com.csksy.anichan" "Anidap:com.laddu100.anidap" "AniSuge:com.laddu100.anisuge" "Miruro:com.laddu100.miruro" "AniKotoAnime:com.anikoto"; do
            module="${spec%%:*}"
            namespace="${spec#*:}"
            printf '\nandroid {\n    namespace = "%s"\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_11\n        targetCompatibility = JavaVersion.VERSION_11\n    }\n}\n' "$namespace" >> "$RUNNER_TEMP/cloudstream-build/$module/build.gradle.kts"
          done
          test -f "$RUNNER_TEMP/cloudstream-build/AniLight/src/main/kotlin/com/anilight/AniLightPlugin.kt"
          test -f "$RUNNER_TEMP/cloudstream-build/AniChan/src/main/kotlin/com/csksy/anichan/AniChanPlugin.kt"
          test -f "$RUNNER_TEMP/cloudstream-build/Anidap/src/main/kotlin/com/laddu100/AnidapPlugin.kt"
          test -f "$RUNNER_TEMP/cloudstream-build/AniSuge/src/main/kotlin/com/laddu100/AniSugePlugin.kt"
          test -f "$RUNNER_TEMP/cloudstream-build/Miruro/src/main/kotlin/com/laddu100/MiruroPlugin.kt"
          test -f "$RUNNER_TEMP/cloudstream-build/AniKotoAnime/src/main/kotlin/com/anikoto/AnikotoPlugin.kt"

      - name: Build AniLight plugin and repository index
        working-directory: ${{ runner.temp }}/cloudstream-build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon AniLight:make AniChan:make Anidap:make AniSuge:make Miruro:make AniKotoAnime:make makePluginsJson
          mkdir -p "$GITHUB_WORKSPACE/plugin-output"
          for provider in AniLight AniChan Anidap AniSuge Miruro AniKotoAnime; do
            find "$provider/build" -type f -name '*.cs3' -exec cp {} "$GITHUB_WORKSPACE/plugin-output/" \;
          done          # Build the trusted index from each verified package manifest.
          # The upstream makePluginsJson task may omit modules imported from another repository.
          python3 - "$GITHUB_WORKSPACE/plugin-output" <<'PY'
          import hashlib, io, json, pathlib, sys, zipfile
          out = pathlib.Path(sys.argv[1])
          wanted = ["AniLight", "AniChan", "Anidap", "AniSuge", "Miruro", "AniKotoAnime"]
          imported = []
          for name in wanted:
              package = out / (name + ".cs3")
              if not package.is_file() or package.stat().st_size == 0:
                  raise SystemExit(f"{name}: build did not produce {package.name}")
              data = package.read_bytes()
              if len(data) > 80 * 1024 * 1024:
                  raise SystemExit(f"{name}: package exceeds 80 MiB")
              with zipfile.ZipFile(io.BytesIO(data)) as archive:
                  names = set(archive.namelist())
                  if not {"classes.dex", "manifest.json"}.issubset(names):
                      raise SystemExit(f"{name}: package missing classes.dex or manifest.json")
                  manifest = json.loads(archive.read("manifest.json"))
              plugin_class = manifest.get("pluginClassName")
              version = manifest.get("version")
              if not isinstance(plugin_class, str) or not plugin_class:
                  raise SystemExit(f"{name}: manifest has no pluginClassName")
              if not isinstance(version, int) or version < 1:
                  raise SystemExit(f"{name}: manifest version is invalid")
              display_name = manifest.get("name") or name
              item = {
                  "name": display_name,
                  "internalName": name,
                  "version": version,
                  "apiVersion": 1,
                  "status": 1,
                  "description": f"{display_name} CloudStream Anime provider",
                  "authors": [],
                  "language": "en",
                  "tvTypes": ["Anime"],
                  "fileSize": len(data),
                  "fileHash": "sha256-" + hashlib.sha256(data).hexdigest(),
                  "url": "https://raw.githubusercontent.com/Sany100/Sany-iptv/builds/" + name + ".cs3"
              }
              imported.append(item)
              print(f"Validated {name} v{version} ({len(data)} bytes), plugin={plugin_class}")
          (out / "plugins.json").write_text(json.dumps(imported, indent=2))
          print("First-stage provider set: " + ", ".join(x["internalName"] for x in imported))
          PY
          test -s "$GITHUB_WORKSPACE/plugin-output/plugins.json"
          test "$(find "$GITHUB_WORKSPACE/plugin-output" -maxdepth 1 -type f -name '*.cs3' | wc -l)" -eq 6

          test -s "$GITHUB_WORKSPACE/plugin-output/plugins.json"
          test "$(find "$GITHUB_WORKSPACE/plugin-output" -maxdepth 1 -type f -name '*.cs3' | wc -l)" -ge 6

      - name: Upload six-provider Anime plugin build
        uses: actions/upload-artifact@v4
        with:
          name: sany-six-provider-anime-cloudstream-plugins
          path: plugin-output/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish SANY six-provider CloudStream repository
        uses: actions/checkout@v4
        with:
          ref: builds
          path: publish
          persist-credentials: true

      - name: Publish plugin files and index
        shell: bash
        run: |
          set -euo pipefail
          find "$GITHUB_WORKSPACE/plugin-output" -maxdepth 1 -type f -name '*.cs3' -exec cp {} "$GITHUB_WORKSPACE/publish/" \;
          cp "$GITHUB_WORKSPACE/plugin-output/plugins.json" "$GITHUB_WORKSPACE/publish/plugins.json"
          test -s "$GITHUB_WORKSPACE/publish/plugins.json"
          cd "$GITHUB_WORKSPACE/publish"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "*.cs3" plugins.json
          if git diff --cached --quiet; then
            echo "No repository changes to publish"
          else
            git commit -m "Publish six Anime providers (AniLight AniChan Anidap AniSuge Miruro AniKotoAnime)"
            git push origin builds
          fi
