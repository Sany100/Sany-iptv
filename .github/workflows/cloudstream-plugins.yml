name: Build AniLight CloudStream Plugin

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cloudstream-original/AniLight/**"
      - ".github/workflows/cloudstream-plugins.yml"

permissions:
  contents: write

concurrency:
  group: cloudstream-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SANY IPTV source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's ubuntu-latest runner already includes the Android SDK.
      # Avoid setup-android's legacy default "tools" package, which no longer exists.

      - name: Prepare CloudStream plugin build project
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/cloudstream3/plugin-template.git "$RUNNER_TEMP/cloudstream-build"
          # The template demo module is not needed and is incompatible with AGP 8 without a namespace.
          rm -rf "$RUNNER_TEMP/cloudstream-build/ExampleProvider"
          # Pin the CloudStream Gradle plugin to a concrete JitPack commit.
          # The template's master-SNAPSHOT coordinate is no longer resolvable.
          sed -i 's/com.github.recloudstream:gradle:master-SNAPSHOT/com.github.recloudstream:gradle:81b1d424d2/' "$RUNNER_TEMP/cloudstream-build/build.gradle.kts"
          sed -i 's/gradle-7.4-bin.zip/gradle-8.12-bin.zip/' "$RUNNER_TEMP/cloudstream-build/gradle/wrapper/gradle-wrapper.properties"
          sed -i 's/com.android.tools.build:gradle:7.0.4/com.android.tools.build:gradle:8.7.3/' "$RUNNER_TEMP/cloudstream-build/build.gradle.kts"
          sed -i 's/kotlin-gradle-plugin:1.7.10/kotlin-gradle-plugin:2.4.0/' "$RUNNER_TEMP/cloudstream-build/build.gradle.kts"
          sed -i 's/compileSdkVersion(30)/compileSdkVersion(36)/; s/targetSdk = 30/targetSdk = 35/' "$RUNNER_TEMP/cloudstream-build/build.gradle.kts"
          # Kotlin 2.4 removes the legacy kotlinOptions DSL; migrate the template compiler settings.
          python3 - "$RUNNER_TEMP/cloudstream-build/build.gradle.kts" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          source = path.read_text()
          pattern = r'tasks\.withType<org\.jetbrains\.kotlin\.gradle\.tasks\.KotlinCompile>\s*\{\s*kotlinOptions\s*\{.*?\n\s*\}\s*\}'
          replacement = '''tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
                  compilerOptions {
                      jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11)
                      freeCompilerArgs.addAll(
                          "-Xno-call-assertions",
                          "-Xno-param-assertions",
                          "-Xno-receiver-assertions"
                      )
                  }
              }'''
          updated, count = re.subn(pattern, lambda _: replacement, source, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f"Expected one legacy kotlinOptions block, found {count}")
          path.write_text(updated)
          PY
          # Match the pinned CloudStream Gradle plugin: it registers a configuration named "cloudstream".
          sed -i 's/val apk by configurations/val cloudstream by configurations/; s/apk("com.lagradost:cloudstream3:pre-release")/cloudstream("com.lagradost:cloudstream3:pre-release")/' "$RUNNER_TEMP/cloudstream-build/build.gradle.kts"
          # Use CloudStream-compatible NiceHttp and Jackson versions for the AniLight API client.
          sed -i 's/implementation("com.github.Blatzar:NiceHttp:0.3.2")/implementation("com.github.Blatzar:NiceHttp:0.4.18")/; /implementation("org.jsoup:jsoup:1.13.1")/a\\        implementation("com.fasterxml.jackson.module:jackson-module-kotlin:2.13.1")' "$RUNNER_TEMP/cloudstream-build/build.gradle.kts"
          cp -a "$GITHUB_WORKSPACE/source/cloudstream-original/AniLight" "$RUNNER_TEMP/cloudstream-build/AniLight"
          # AGP 8 requires an explicit Android namespace for library modules.
          printf '\nandroid {\n    namespace = "com.anilight"\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_11\n        targetCompatibility = JavaVersion.VERSION_11\n    }\n}\n' >> "$RUNNER_TEMP/cloudstream-build/AniLight/build.gradle.kts"
          test -f "$RUNNER_TEMP/cloudstream-build/AniLight/build.gradle.kts"
          test -f "$RUNNER_TEMP/cloudstream-build/AniLight/src/main/kotlin/com/anilight/AniLightPlugin.kt"

      - name: Build AniLight plugin and repository index
        working-directory: ${{ runner.temp }}/cloudstream-build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon AniLight:make makePluginsJson
          mkdir -p "$GITHUB_WORKSPACE/plugin-output"
          find AniLight/build -type f -name '*.cs3' -exec cp {} "$GITHUB_WORKSPACE/plugin-output/" \;
          test -s build/plugins.json
          cp build/plugins.json "$GITHUB_WORKSPACE/plugin-output/plugins.json"
          test -n "$(find "$GITHUB_WORKSPACE/plugin-output" -maxdepth 1 -type f -name '*.cs3' -print -quit)"

      - name: Upload AniLight plugin build
        uses: actions/upload-artifact@v4
        with:
          name: anilight-cloudstream-plugin
          path: plugin-output/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish CloudStream repository
        uses: actions/checkout@v4
        with:
          ref: builds
          path: publish
          persist-credentials: true

      - name: Publish plugin files and index
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN_FILE="$(find "$GITHUB_WORKSPACE/plugin-output" -maxdepth 1 -type f -name '*.cs3' -printf '%f\n' | head -n 1)"
          test -n "$PLUGIN_FILE"
          cp "$GITHUB_WORKSPACE/plugin-output/$PLUGIN_FILE" "$GITHUB_WORKSPACE/publish/$PLUGIN_FILE"
          PLUGIN_URL="https://raw.githubusercontent.com/Sany100/Sany-iptv/builds/$PLUGIN_FILE"
          jq --arg url "$PLUGIN_URL" 'map(.url = $url)' "$GITHUB_WORKSPACE/plugin-output/plugins.json" > "$GITHUB_WORKSPACE/publish/plugins.json"
          cd "$GITHUB_WORKSPACE/publish"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PLUGIN_FILE" plugins.json
          if git diff --cached --quiet; then
            echo "No repository changes to publish"
          else
            git commit -m "Publish AniLight CloudStream plugin"
            git push origin builds
          fi
